  curmod:(f,fd)=>{const p=curProg();const v={title:fd.get('title').trim(),desc:fd.get('desc').trim(),steps:fd.get('steps').split('\n').map(x=>x.trim()).filter(Boolean)};if(!v.title){toast('Add a title.');return}
    let m=p.modules.find(x=>x.id===f.dataset.id);if(m)Object.assign(m,v);else{m={id:uid(),sections:[],files:[],...v};p.modules.push(m)}
    closeModal();ui.cur.mid=m.id;commit(f.dataset.id?'Lesson plan saved':'Lesson plan added')},
  cursec:(f,fd)=>{const m=curMod();const v={title:fd.get('title').trim(),minutes:parseInt(fd.get('minutes'))||0,body:fd.get('body')};if(!v.title){toast('Add a title.');return}
    const x=m.sections.find(y=>y.id===f.dataset.id);if(x)Object.assign(x,v);else m.sections.push({id:uid(),...v});closeModal();commit(f.dataset.id?'Section saved':'Section added')},
  notes:(f,fd)=>{const covered=(fd.get('covered')||'').trim();if(!covered){toast('Add what was covered in the class.');return}
    state.classNotes[f.dataset.k]={trainerId:fd.get('trainerId'),plan:fd.get('plan')||'',covered,next:(fd.get('next')||'').trim(),at:TODAY};closeModal();commit('Class notes saved')},
  login:async(f,fd)=>{const btn=f.querySelector('button.primary');if(btn)btn.disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:String(fd.get('u')).trim(),password:fd.get('p')});
    if(btn)btn.disabled=false;
    if(error){toast(/invalid/i.test(error.message)?"That email and password don't match. Check them and try again.":error.message);return}
    await afterSignIn(data.user)},
  pwchange:async(f,fd)=>{const p1=fd.get('p1'),p2=fd.get('p2');
    if(p1.length<8){toast('Use at least 8 characters.');return}if(p1!==p2){toast("The two passwords don't match.");return}
    const {error}=await sb.auth.updateUser({password:p1});if(error){toast(/same/i.test(error.message)?'Choose a password different from the temporary one.':error.message);return}
    await sb.rpc('ako_password_changed');const was=me.must_change_password;me.must_change_password=false;closeModal();toast('Password saved');
    if(was){const {data:{user}}=await sb.auth.getUser();await afterSignIn(user)}},
  staffadd:(f,fd)=>staffAction({action:'create',name:fd.get('name').trim(),email:fd.get('email').trim(),role:fd.get('role'),password:fd.get('password')},`Account created for ${fd.get('email').trim()}. Give them the temporary password.`),
  staffpw:(f,fd)=>{closeModal();staffAction({action:'set_password',user_id:f.dataset.id,password:fd.get('password')},'Password reset. Give them the temporary password.')},
  users:(f,fd)=>{const v={};for(const k of ['admin','trainer'])v[k]={username:fd.get(k+'-u').trim(),password:fd.get(k+'-p')};
    if(Object.values(v).some(x=>!x.username||!x.password)){toast('Every username and password needs a value.');return}
    if(norm(v.admin.username)===norm(v.trainer.username)){toast('The admin and trainer usernames must be different.');return}
    state.users=v;commit('Logins saved')},
  checkin:(f,fd)=>{const code=(fd.get('code')||'').trim();if(!code)return;const date=ui.attDate||TODAY;
    const st=state.students.find(s=>s.code===code);
    if(!st){toast(`No student has the code ${code}.`);return}
    const list=state.sessions.filter(x=>x.studentId===st.id&&live(x)&&x.date===date).sort((a,b)=>a.start<b.start?-1:1);
    if(!list.length){toast(`${stName(st)} has no class on ${fmtDw(date)}.`);return}
    const s=list.find(x=>x.status!=='Present')||list[0];
    if(s.status==='Present'){toast(`${stName(st)} is already checked in.`);f.reset();return}
    if(attState(s)==='Makeup')markAttendance(s,'Present');else s.status='Present';
    commit(`${stName(st)} checked in for ${fmtT(s.start)}`);const i=$('#att-code');if(i)i.focus()},
  makeup:(f,fd)=>{const src=state.sessions.find(x=>x.id===f.dataset.id);if(!src)return;const st=studentById(src.studentId);const mode=fd.get('mumode');
    if(mode==='end'){src.makeupMode='end';closeModal();generateStudent(st);commit('Make-up added at the end of the course');return}
    let o;
    if(mode==='join'){const k=fd.get('host');const host=k&&state.sessions.filter(x=>live(x)&&slotKey(x)===k);if(!host||!host.length){toast('Choose a class to join.');return}
      const h=host[0];o={date:h.date,start:h.start,end:h.end,location:h.location,room:h.room,trainerId:effTrainer(h),groupId:h.groupId,conflict:false}}
    else{const date=fd.get('date'),start=fd.get('time'),dur=parseInt(fd.get('duration'))||90;
      if(!date||!start){toast('Choose a date and start time.');return}
      if(blockedOn(date)){toast(`${fmtD(date)} is a holiday (${blockedOn(date).name}). Pick another date.`);return}
      const end=plus(start,dur),loc=locOf(st),gid='mu'+uid();let room=fd.get('room'),conflict=false;
      if(room==='auto'){room=state.classrooms.find(r=>!roomBusy(date,start,end,loc,r,gid));if(!room){room=state.classrooms[0];conflict=true}}else conflict=roomBusy(date,start,end,loc,room,gid);
      let tr=fd.get('trainer');if(tr==='auto')tr=pickTrainer(date,start,end,gid)||effTrainer(src);
      o={date,start,end,location:loc,room,trainerId:tr,groupId:gid,conflict}}
    const mk=bookMakeup(src,mode,o);let extra=0;
    if(mode==='one')fd.getAll('also').forEach(id=>{const x=state.sessions.find(y=>y.id===id);if(x&&x.makeup&&x.makeupMode==='pending'){bookMakeup(x,'one',{...o});extra++}});
    closeModal();setTimeout(()=>suggestOthers(mk),0);
    commit(`Make-up ${mode==='one'?'session':''} booked for ${fmtDw(mk.date)}, ${fmtT(mk.start)}${extra?` with ${extra+1} students`:''}`+(mk.conflict?'. That room is already booked then, so check the classroom.':''))},
  lead:(f,fd)=>{const id=f.dataset.id;const type=f.dataset.type;const fields=type==='B2C'?B2C_FIELDS:B2B_FIELDS;
    const l=id?leadById(id):{id:uid(),type,createdAt:TODAY,lastContact:''};
    fields.forEach(([k])=>l[k]=(fd.get(k)||'').trim());l.status=fd.get('status');
    if(!id)state.leads.push(l);if(type==='B2C')generateTrial(l);closeModal();
    ui.leadTab=type;commit(id?'Lead updated':`Lead added. First reminder ${fmtD(leadNext(l))}`)},
  trainer:(f,fd)=>{const rate=parseFloat(fd.get('rate'));if(!(rate>=0)){toast('Enter the pay per hour.');return}
    state.trainers.push({id:uid(),name:fd.get('name').trim(),phone:fd.get('phone').trim(),email:fd.get('email').trim(),rate,active:true,joined:TODAY});commit(`Trainer added at ${money(rate)} an hour`)},
  traineredit:(f,fd)=>{const t=trainerById(f.dataset.id);const rate=parseFloat(fd.get('rate'));const name=fd.get('name').trim();
    if(!name){toast('Add a name.');return}if(!(rate>=0)){toast('Enter the pay per hour.');return}
    const changed=rate!==rateOf(t.id);Object.assign(t,{name,phone:fd.get('phone').trim(),email:fd.get('email').trim(),rate});closeModal();
    commit(changed?`${name} now paid ${money(rate)} an hour. Classes already marked paid keep their old rate.`:'Trainer saved')},
  topic:(f,fd)=>{const t=fd.get('topic').trim();if(state.topics.some(x=>norm(x)===norm(t))){toast(`${t} already exists.`);return}state.topics.push(t);commit('Topic added')},
  room:(f,fd)=>{const r=fd.get('room').trim();if(state.classrooms.some(x=>norm(x)===norm(r))){toast(`${r} already exists.`);return}state.classrooms.push(r);commit('Classroom added')},
  loc:(f,fd)=>{const v=fd.get('v').trim();if(norm(v)==='ad-hoc'){toast('Ad-hoc is always offered already.');return}if(state.locations.some(x=>norm(x)===norm(v))){toast(`${v} already exists.`);return}state.locations.push(v);commit(`${v} added to locations`)},
  course:(f,fd)=>{const v=fd.get('v').trim(),k=fd.get('cat');if(state.courses[k].some(x=>norm(x)===norm(v))){toast(`${v} already exists.`);return}state.courses[k].push(v);commit(`${v} added to ${catOf(k)[3].toLowerCase()}`)},
  slot:(f,fd)=>{const st=studentById(ui.schedStudent);const raw=fd.get('duration');const dur=raw?parseInt(raw):null;
    if(dur!==null&&(!(dur>=15)||dur>480)){toast('Enter a duration between 15 and 480 minutes.');return}
    const sd=fd.get('startDate');if(!sd){toast('Choose a start date.');return}st.startDate=sd;st.slotDay=fd.get('slotDay')??'';st.slotTime=fd.get('slotTime')||'';st.duration=dur;closeModal();generateStudent(st);
    commit(st.note||(`Schedule regenerated. First class: ${firstClassOf(st)?fmtDw(firstClassOf(st)):'none'}.`+slotWarning(st.slotDay,st.slotTime,dur||(st.scheduleType==='Weekly Courses'?90:180))))},
  adhoc:(f,fd)=>{state.holidays.push({id:uid(),date:fd.get('date'),name:fd.get('name').trim(),kind:'adhoc'});regenAll();commit('Ad-hoc holiday added, schedules updated')},
  school:(f,fd)=>{let a=fd.get('from'),b=fd.get('to');if(b<a)[a,b]=[b,a];state.holidays.push({id:uid(),date:a,end:b,name:fd.get('name').trim(),kind:'school'});commit('School holiday added. Classes still run.')},
  resched:(f,fd)=>{const s=state.sessions.find(x=>x.id===f.dataset.id);s.reason=fd.get('reason');
    if(fd.get('mode')==='move'){const d=fd.get('date');if(!d){toast('Choose a new date.');return}
      if(blockedOn(d)){toast(`${fmtD(d)} is a holiday (${blockedOn(d).name}). Pick another date.`);return}
      const len=toMin(s.end)-toMin(s.start);s.date=d;s.start=fd.get('time');s.end=plus(s.start,len);s.room=fd.get('room');s.manual=true;s.status='Scheduled';
      s.conflict=roomBusy(s.date,s.start,s.end,s.location,s.room,s.groupId);closeModal();commit(s.conflict?'Moved, but that room is already booked then':'Class moved')}
    else{s.status='Cancelled';s.makeup=true;s.makeupMode='end';closeModal();if(s.studentId)regenFor(studentById(s.studentId));commit('Marked not held. Make-up class added.')}},
  enroll:()=>{const d=ui.enrollDraft;
    const need=[['parentName','parent name'],['firstName',"child's first name"],['lastName',"child's last name"],['course','course name'],['startDate','start date']];
    const miss=need.filter(([k])=>!String(d[k]||'').trim());if(d.location==='Ad-hoc'&&!d.adhocLocation.trim())miss.push(['adhocLocation','ad-hoc location']);
    if(miss.length){toast('Add the '+miss.map(m=>m[1]).join(', ')+'.');return}
    const dur=d.duration?parseInt(d.duration):null;if(dur!==null&&(!(dur>=15)||dur>480)){toast('Enter a duration between 15 and 480 minutes.');return}
    const isEdit=!!d.editingId;const returning=!isEdit&&d.reg==='Existing';
    const prev=returning?state.students.filter(s=>s.username===d.existingUser).at(-1):null;
    if(returning&&!prev){toast('Choose the existing student.');return}
    const st=isEdit?studentById(d.editingId):{id:uid(),enrolledAt:TODAY,extra:0};
    Object.assign(st,{leadId:d.conv==='Yes'?d.leadId||null:null,parentName:d.parentName.trim(),phone:d.phone.trim(),email:d.email.trim(),firstName:d.firstName.trim(),lastName:d.lastName.trim(),age:d.age.trim(),course:d.course.trim(),location:d.location,adhocLocation:d.location==='Ad-hoc'?d.adhocLocation.trim():'',scheduleType:d.scheduleType,
      fee:d.scheduleType==='Weekly Courses'?null:(String(d.fee??'').trim()===''?null:Math.max(0,round2(+d.fee)||0)),sessions:d.scheduleType==='Weekly Courses'?Math.max(1,parseInt(d.sessions)||12):(d.scheduleType==='Holiday Camp'?5:1),startDate:d.startDate,comments:d.comments.trim(),password:d.password.trim()||DEFAULT_PW,slotDay:d.scheduleType==='Weekly Courses'?d.slotDay:'',slotTime:d.slotTime||'',duration:dur});
    if(returning){st.username=prev.username;st.password=prev.password;st.code=prev.code}
    else if(!isEdit||!st.username)st.username=makeUsername(st.firstName,st.lastName,st.id);
    if(!st.code)st.code=newCode();if(!isEdit)state.students.push(st);
    if(st.leadId){const l=leadById(st.leadId);if(l){l.status='Converted';generateTrial(l)}}
    generateStudent(st);ui.enrollDraft=blankDraft();ui.schedStudent=st.id;
    commit(st.note?`${stName(st)} saved. ${st.note}`:`${stName(st)} ${isEdit?'updated':returning?'enrolled again with the same login':'enrolled'}. Username ${st.username}, schedule ready.${firstClassOf(st)?` First class: ${fmtDw(firstClassOf(st))}.`:''}`+slotWarning(st.slotDay,st.slotTime,dur||(st.scheduleType==='Weekly Courses'?90:180)))}
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;e.preventDefault();ACT[a.dataset.act]?.(a.dataset,a)});
document.addEventListener('change',e=>{const el=e.target;
  if((el.name==='startDate'||el.name==='slotDay')&&el.form&&el.form.dataset.form==='slot'){const st=studentById(ui.schedStudent);const h=$('#sl-hint');
    if(st&&h)h.innerHTML=startHint({scheduleType:st.scheduleType,startDate:el.form.elements.startDate.value,slotDay:el.form.elements.slotDay?el.form.elements.slotDay.value:''});return}
  if(el.name==='ctype'){document.querySelectorAll('[data-ctype]').forEach(x=>{x.hidden=x.dataset.ctype!==el.value;if(x.hidden)x.querySelector('input').checked=false});return}
  if(el.name==='mumode'){document.querySelectorAll('[data-mu]').forEach(x=>x.hidden=x.dataset.mu!==el.value);return}
  if(el.dataset.chg){CHG[el.dataset.chg]?.(el);return}
  if(el.dataset.draft&&ui.enrollDraft){const k=el.dataset.draft;ui.enrollDraft[k]=el.value;
    if(k==='reg'){Object.assign(ui.enrollDraft,{existingUser:'',username:'',password:DEFAULT_PW,conv:'No',leadId:''});render();return}
    if(k==='existingUser'){const p=state.students.filter(s=>s.username===el.value).at(-1);if(p)Object.assign(ui.enrollDraft,{parentName:p.parentName,phone:p.phone,email:p.email,firstName:p.firstName,lastName:p.lastName,age:p.age,location:p.location,adhocLocation:p.adhocLocation||'',username:p.username,password:p.password});render();return}
    if(k==='leadId'){const l=leadById(el.value);if(l){const pw=ui.enrollDraft.password;ui.enrollDraft={...draftFromLead(l),password:pw,editingId:ui.enrollDraft.editingId}}render()}
    else if(k==='startDate'){const h=$('#ef-hint');if(h)h.innerHTML=startHint(ui.enrollDraft)}
    else if(['conv','location','scheduleType','slotDay'].includes(k)){if(k==='conv'&&el.value==='No')ui.enrollDraft.leadId='';if(k==='scheduleType'&&!state.courses[catKey(el.value)].includes(ui.enrollDraft.course))ui.enrollDraft.course='';render()}}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.matches('[data-count]')){const c=el.nextElementSibling;if(c?.classList.contains('counter'))c.textContent=`${el.value.length} / ${el.maxLength}`}
  if(el.dataset.draft&&ui.enrollDraft&&el.type!=='radio'&&el.tagName!=='SELECT'){const d=ui.enrollDraft;d[el.dataset.draft]=el.value;
    if(['firstName','lastName'].includes(el.dataset.draft)&&!d.editingId&&d.reg!=='Existing'){d.username=makeUsername(d.firstName,d.lastName,'');const u=$('#ef-user');if(u)u.value=d.username}}
  if(el.id==='cur-search'){ui.cur.q=el.value;const r=$('#cur-list');if(r)r.innerHTML=curList()}
  if(el.id==='att-search'){ui.attQuery=el.value;const r=$('#att-results');if(r)r.innerHTML=attResults()}
});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const badDate=[...f.querySelectorAll('input[type=date]')].find(i=>i.value&&!fullDate(i.value));if(badDate){toast('Check the year in that date. It should be 4 digits, like 2026.');badDate.focus();return}FORMS[f.dataset.form]?.(f,new FormData(f))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('hashchange',route);

window.addEventListener('beforeunload',e=>{if(syncing||syncTimer&&$('#sync-status')?.classList.contains('pending')){e.preventDefault();e.returnValue=''}});
boot();
</script>

</body>
</html>

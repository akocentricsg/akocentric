<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Ako Centric CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark navy rail of modules on the left, a light working canvas on the right; collapses to a top strip on phones. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --sunken:#eaecf2; --ink:#1a2030; --muted:#5a6377; --line:#dde1ea;
  --accent:#c4501b; --accent-ink:#ffffff; --accent-soft:#fbe8dd;
  --nav:#1c2440; --nav-ink:#c3cadf; --nav-hi:#ffffff; --nav-soft:#2a3456;
  --good:#1d7a4c; --good-soft:#e0f2e8; --warn:#8f5c00; --warn-soft:#fcf0d4; --bad:#b42318; --bad-soft:#fde6e3; --info:#3345a6; --info-soft:#e5e8f8;
  --bar:#3a4a86;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141c; --surface:#191e2a; --sunken:#212736; --ink:#e5e8ef; --muted:#9aa2b6; --line:#2b3243;
  --accent:#ee7d45; --accent-ink:#1d0f06; --accent-soft:#3a2317;
  --nav:#0c0f17; --nav-ink:#a8b0c6; --nav-hi:#ffffff; --nav-soft:#1d2335;
  --good:#5fc896; --good-soft:#14301f; --warn:#e6b04c; --warn-soft:#33280f; --bad:#f2877c; --bad-soft:#3a1714; --info:#97a6f2; --info-soft:#1d2342;
  --bar:#8d9de8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#191e2a; --sunken:#212736; --ink:#e5e8ef; --muted:#9aa2b6; --line:#2b3243;
  --accent:#ee7d45; --accent-ink:#1d0f06; --accent-soft:#3a2317;
  --nav:#0c0f17; --nav-ink:#a8b0c6; --nav-hi:#ffffff; --nav-soft:#1d2335;
  --good:#5fc896; --good-soft:#14301f; --warn:#e6b04c; --warn-soft:#33280f; --bad:#f2877c; --bad-soft:#3a1714; --info:#97a6f2; --info-soft:#1d2342;
  --bar:#8d9de8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--nav-hi);letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--nav-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--nav-soft);color:var(--nav-hi)}
.nav a.on{background:var(--nav-soft);color:var(--nav-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav .num{font-family:var(--f-mono);font-size:11px;opacity:.6;width:16px}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:none;border:1px solid var(--nav-soft);color:var(--nav-ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer;text-align:left}
.side-foot button:hover{color:var(--nav-hi)}
.side-foot .me{color:var(--nav-hi);font-weight:600}
.sync{display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.pending::before{background:var(--warn)}.sync.error::before{background:var(--bad)}
.staff-row{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.staff-row:first-child{border-top:0}
main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding:0 12px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em}
.card h3{font-size:14px;margin:0;font-weight:600}
.card .sub{color:var(--muted);font-size:13px;margin:-8px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font:500 13px/1.3 var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--sunken);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.past td{color:var(--muted)}
tr.cancel td{text-decoration-color:var(--muted)}
td.num,th.num{text-align:right}
td .small{display:block;font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=search],input[type=password],input[type=time],input[type=date],input[type=number],input[type=email],select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:68px;resize:vertical}
td select,td input[type=text],td input[type=date]{padding:4px 6px;font-size:13px;min-width:120px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.radio{display:flex;gap:14px}
.radio label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink)}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.notice.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.notice b{color:var(--warn)}
.notice.info b{color:var(--info)}
.todo{display:flex;flex-direction:column}
.todo li{list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.todo li:first-child{border-top:0}
.todo ul{margin:0;padding:0}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:130px minmax(0,1fr) 120px;gap:12px;align-items:center}
.track{height:12px;background:var(--sunken);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:3px}
.fill.top{background:var(--accent)}
.barrow .amt{font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .it:first-child{border-top:0}
.day{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{display:inline-flex;align-items:center;gap:6px;background:var(--sunken);border-radius:6px;padding:3px 4px 3px 9px;font-size:12.5px;max-width:100%}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.file button{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:4px;font:inherit}
.file button:hover{background:var(--surface);color:var(--ink)}
.portal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px 20px}
.summary div{display:flex;flex-direction:column;gap:2px}
.summary .v{font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,14,24,.5);display:flex;align-items:flex-start;justify-content:center;z-index:40;overflow:auto;padding-block:max(32px,env(safe-area-inset-top,0px)) 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border-radius:10px;width:min(720px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.panel h2{font-family:var(--f-display);margin:0;font-size:21px}
.panel .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.invoice{border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.invoice .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.invoice .co{font-family:var(--f-display);font-weight:700;font-size:20px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.right{margin-left:auto}
.mini{font-size:12px;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.login .logo{background:#fff;border-radius:10px;padding:10px;display:flex;justify-content:center}
.login .logo img{height:120px;width:auto}
.login h1{font-family:var(--f-display);font-size:24px;margin:0;text-align:center}
.login p{margin:0;text-align:center;color:var(--muted)}
.invoice{--surface:#ffffff;--sunken:#f1f3f7;--line:#dde1ea;--ink:#1a2030;--muted:#5a6377;background:#ffffff;color:#1a2030}
.lh{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lh .ako{height:96px;width:auto}
.lh .res{height:28px;width:auto}
.lh-co{display:flex;flex-direction:column;gap:1px;font-size:12.5px;padding-bottom:12px;border-bottom:2px solid #1c3a6e}
.lh-co b{font-size:14px;color:#1c3a6e}
.pay{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.pay img{width:132px;height:132px}
.pay div{display:flex;flex-direction:column;gap:3px}
.who-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{border:0;background:none;font:600 14px var(--f-body);padding:6px 11px;border-radius:6px;color:var(--ink);cursor:pointer}
.pills button:hover{background:var(--sunken)}
.pills button.on{color:var(--accent);background:var(--accent-soft)}
.pills .n{font-weight:500;color:var(--muted);margin-left:4px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.searchbox input{padding:11px 12px 11px 42px;font-size:15px}
.series{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.cathead{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-top:10px}
.checks{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.prow:hover{border-color:var(--accent)}
.prow>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow .t{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow .s{color:var(--muted);font-size:13.5px}
.go{color:var(--accent);font-weight:600;white-space:nowrap;flex:none}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font:600 14px var(--f-body);align-self:flex-start}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.step{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 18px;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.step svg{flex:none;color:var(--bar)}
.step p{margin:0;font-size:15px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(20,30,60,.06)}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec h3{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:-.01em}
details.sec .chev{margin-left:auto;flex:none;transition:transform .15s;color:var(--muted)}
details.sec[open] .chev{transform:rotate(180deg)}
details.sec .body{padding:0 20px 18px;display:flex;flex-direction:column;gap:4px}
.rich{max-width:80ch;line-height:1.6;font-size:14.5px}
.rich p{margin:0 0 10px}.rich ul{margin:0 0 10px;padding-left:22px}.rich li{margin:2px 0}
.rich a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.navarrows{display:flex;gap:4px;flex:none}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.note.this{border-left-color:var(--good)}
.clip{white-space:pre-wrap;overflow-wrap:anywhere;max-width:72ch}
.datebar{display:flex;align-items:center;gap:6px}
.datebar input{width:auto}
.checkin{display:flex;gap:10px;align-items:stretch}
.checkin input{font-size:16px;padding:10px 12px}
.checkin .btn{padding-inline:18px;font-size:14px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.dayhead h2{font-family:var(--f-display);font-size:21px;margin:0;letter-spacing:-.01em}
.legend{font-size:13px;color:var(--muted)}
.legend b{font-weight:600}
.t-good{color:var(--good)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.acard>div{padding:13px 18px;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.acard>div+div{border-top:1px solid var(--line)}
.acard .time{font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.acard .where{font-weight:600}
.acard .who{display:flex;flex-direction:column;gap:6px;min-width:0}
.acard select{width:auto}
.tag{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 8px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0;margin-left:auto}
.seg button{border:0;background:var(--surface);color:var(--ink);font:600 13px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover:not([disabled]){background:var(--sunken)}
.seg button.on.g{background:var(--good-soft);color:var(--good)}
.seg button.on.b{background:var(--bad-soft);color:var(--bad)}
.seg button.on.w{background:var(--warn-soft);color:var(--warn)}
.seg button[disabled]{color:var(--muted);cursor:not-allowed;opacity:.6}
.pick{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.pick .small{display:block}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:400;color:var(--ink)}
.pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pick input{margin-top:3px}
@media (max-width:640px){.checkin{flex-direction:column}.seg{margin-left:0}}
.counter{font-size:11px;color:var(--muted);text-align:right}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}

function colRecords(k,v,out){

      const {error}=await sb.from('ako_records').upsert(part.map(k=>{const [c,id]=k.split('\u0001');return {collection:c,id,data:JSON.parse(cur.get(k))}}));

function applyRemote(p){
  if(!state)return;
  const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.collection)return;
  const c=r.collection,id=r.id,k=RK(c,id);
  const local=new Map();if(c==='config')colRecords(id,state[id],local);else colRecords(c,state[c],local);
  if(p.eventType!=='DELETE'&&local.has(k)&&synced.has(k)&&local.get(k)!==synced.get(k))return; // unsaved local edit wins, but a removal made elsewhere always applies
  if(p.eventType==='DELETE'){
    if(ARR_COLS.includes(c))state[c]=state[c].filter(x=>x.id!==id);else if(MAP_COLS.includes(c))delete state[c][id];
    synced.delete(k);
  }else{
    const data=r.data;if(c==='config'){state[id]=data}
    else if(ARR_COLS.includes(c)){const o=data._o;delete data._o;const i=state[c].findIndex(x=>x.id===id);if(i>=0)state[c][i]=data;else if(o!=null&&o<state[c].length)state[c].splice(o,0,data);else state[c].push(data)}
    else if(MAP_COLS.includes(c))state[c][id]=data;
    const re=new Map();if(c==='config')colRecords(id,state[id],re);else colRecords(c,state[c],re);synced.set(k,re.get(k));
  }

}

function generateStudent(st,oldList){
  const all=oldList||state.sessions.filter(x=>x.studentId===st.id);
  const fixed=all.filter(x=>x.kind==='makeup'), prior=all.filter(x=>x.kind!=='makeup');
  const old={};prior.forEach(x=>old[x.key]=x);
  state.sessions=state.sessions.filter(x=>x.studentId!==st.id);
  st.skipped=[];st.note='';st.pattern=null;
  // Classes already in the past stay exactly as they happened; only today onwards is rebuilt.
  const hasPrior=prior.length>0;
  const recorded=x=>x.status!=='Scheduled'||x.manual||x.makeup||x.makeupRef;
  const kept=hasPrior?prior.filter(x=>x.date<TODAY&&x.date>=(st.startDate||'')&&recorded(x)).sort((a,b)=>a.date<b.date?-1:1):[];
  const bail=msg=>{st.note=msg;state.sessions.push(...kept,...fixed)};
  const rooms=state.classrooms, loc=locOf(st);
  if(!rooms.length)return bail('Add at least one classroom in Settings before generating schedules.');
  if(!state.trainers.some(t=>t.active))return bail('Add at least one trainer before generating schedules.');
  if(!st.startDate)return bail('Set a start date to generate a schedule.');
  const from=kept.length?addDays(kept[kept.length-1].date,1):st.startDate;
  const kind=st.scheduleType==='Weekly Courses'?'weekly':st.scheduleType==='Holiday Camp'?'camp':'workshop';
  const mk=o=>({id:uid(),studentId:st.id,leadId:null,kind,course:st.course,location:loc,status:'Scheduled',makeup:false,reason:'',override:'',manual:false,conflict:false,...o});
  const applyPrev=s=>{const p=old[s.key];if(!p)return s;s.status=p.status;s.makeup=p.makeup;s.reason=p.reason;s.override=p.override;s.makeupMode=p.makeupMode;s.makeupRef=p.makeupRef;if(p.manual){s.manual=true;s.date=p.date;s.start=p.start;s.end=p.end;s.room=p.room;s.conflict=false}return s};
  const out=[...kept];
  if(kind==='weekly'){
    const dur=st.duration||90;
    const wantDay=(st.slotDay===''||st.slotDay==null)?null:+st.slotDay, wantTime=st.slotTime||null;
    let pat=null;
    const groups={};
    state.sessions.forEach(x=>{if(x.kind==='weekly'&&x.studentId&&x.location===loc&&norm(x.course)===norm(st.course)&&x.key[0]==='R'&&!x.manual)(groups[x.groupId]??=[]).push(x)});
    for(const [gid,list] of Object.entries(groups)){
      if(new Set(list.map(x=>x.studentId)).size>=MAX_GROUP)continue;
      const last=list.reduce((a,x)=>x.date>a?x.date:a,'');
      if(last<from)continue;
      const f=list.filter(x=>x.date>=from).sort((a,b)=>a.date<b.date?-1:1)[0];
      if(toMin(f.end)-toMin(f.start)!==dur)continue;
      if(wantDay!==null&&dow(f.date)!==wantDay)continue;
      if(wantTime&&f.start!==wantTime)continue;
      pat={wd:dow(f.date),start:f.start,dur,room:f.room,trainerId:f.trainerId,groupId:gid,joined:true};break;
    }
    if(!pat){
      outer:for(let i=0;i<14;i++){
        const d=addDays(from,i);if(blockedOn(d))continue;if(wantDay!==null&&dow(d)!==wantDay)continue;
        for(const t of (wantTime?[wantTime]:startsFor(d,dur))){const e=plus(t,dur);
          for(const r of rooms){if(roomBusy(d,t,e,loc,r,null))continue;
            const gid='g'+uid();const tr=pickTrainer(d,t,e,gid);if(!tr)continue;
            pat={wd:dow(d),start:t,dur,room:r,trainerId:tr,groupId:gid,joined:false};break outer}}}
    }
    if(!pat&&wantDay!==null&&wantTime){
      // The admin fixed both day and time: keep it, and flag clashes on the sessions.
      let d=from,g=0;while((dow(d)!==wantDay||blockedOn(d))&&g++<60)d=addDays(d,1);
      const gid='g'+uid();
      pat={wd:wantDay,start:wantTime,dur,room:rooms[0],trainerId:pickTrainer(d,wantTime,plus(wantTime,dur),gid)||state.trainers.find(t=>t.active).id,groupId:gid,joined:false};
    }
    if(!pat)return bail(wantDay!==null||wantTime?'No free classroom and trainer at the chosen day or time in the two weeks after the start date. Try another time slot.':'No free classroom and trainer found in the two weeks after the start date.');
    st.pattern=pat;
    let d=from;while(dow(d)!==pat.wd)d=addDays(d,1);
    const extra=st.extra||0;let target=st.sessions+extra+out.filter(isEndMk).length,guard=0;
    while(out.length<target&&guard++<400){
      const h=blockedOn(d);

      else{
        const e=plus(pat.start,pat.dur);let room=pat.room,conflict=false;
        if(roomBusy(d,pat.start,e,loc,room,pat.groupId)){const alt=rooms.find(r=>!roomBusy(d,pat.start,e,loc,r,pat.groupId));if(alt)room=alt;else conflict=true}
        const idx=out.length;const key=idx<st.sessions?'R'+(idx+1):'M'+(idx-st.sessions+1);
        out.push(applyPrev(mk({key,date:d,start:pat.start,end:e,room,trainerId:pat.trainerId,groupId:pat.groupId,conflict})));
        target=st.sessions+extra+out.filter(isEndMk).length;
      }

function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
function confirmBox(title,body,okLabel,fn){ui.pending=fn;openModal(`<h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(body)}</p><div class="foot"><button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="confirm-ok">${esc(okLabel)}</button></div>`)}
const chip=(t,tone='')=>`<span class="chip ${tone}">${esc(t)}</span>`;
const opt=(v,cur,label)=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(label??v)}</option>`;
const header=(eyebrow,title,desc,actions='')=>`<div class="ph"><div><div class="eyebrow">${esc(/^Module \d+$/.test(eyebrow)?modLabel():eyebrow)}</div><h1>${esc(title)}</h1>${desc?`<p>${desc}</p>`:''}</div><div class="row">${actions}</div></div>`;
const table=(head,rows,empty='Nothing here yet.')=>`<div class="tbl"><table><thead><tr>${head.map(h=>typeof h==='string'?`<th>${h}</th>`:`<th class="${h[1]}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${head.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
const trainerOpts=(cur,blank)=>(blank?opt('',cur,blank):'')+state.trainers.filter(t=>t.active||t.id===cur).map(t=>opt(t.id,cur,t.name)).join('');

function render(){

  if(!canSee(ui.view))ui.view=role==='trainer'?'attendance':'overview';

function route(){if(!state)return render();let h=location.hash.slice(1);if(h==='holidays')h='setup';ui.view=VIEWS.some(v=>v[0]===h)?h:'overview';render();window.scrollTo(0,0)}

/* ---------- views ---------- */
function vOverview(){
  const due=state.leads.filter(leadDue);
  const certs=certRows().filter(c=>c.status==='Due');
  const n25=next25();const invs=allInvoices().filter(i=>i.issue.slice(0,7)===n25.slice(0,7)&&i.status!=='Paid');
  const slots=trainerSlots();const owed=slots.filter(s=>s.status==='Present'&&!s.paid).reduce((a,s)=>a+s.due,0);
  const wkEnd=addDays(TODAY,7);const upcoming=slots.filter(s=>s.date>=TODAY&&s.date<wkEnd);
  const items=[];
  due.forEach(l=>items.push(`<li><div><b>Follow up with ${esc(l.type==='B2C'?l.parentName:l.partnershipName)}</b><span class="small mini">${l.type} lead · registered ${fmtD(l.createdAt)} · ${esc(l.phone)}</span></div><div class="row">${chip('Due '+fmtD(leadNext(l)),'warn')}<button class="btn sm" data-act="lead-touch" data-id="${l.id}">Mark followed up</button></div></li>`));

  const um=unmarked();if(um.length)items.push(`<li><div><b>Attendance not marked for ${um.length} student${um.length>1?'s':''}</b><span class="small mini">${[...new Set(um.map(x=>x.date))].sort().map(d=>fmtD(d)).join(', ')}</span></div><button class="btn sm" data-act="att-goto" data-d="${um.map(x=>x.date).sort()[0]}">Mark attendance</button></li>`);
  const pm=pendingMakeups();if(pm.length)items.push(`<li><div><b>${pm.length} make-up class${pm.length>1?'es':''} to arrange</b><span class="small mini">${pm.map(x=>esc(sessName(x))).join(', ')}</span></div><a class="btn sm" href="#attendance">Open attendance</a></li>`);

  return header(fmtDw(TODAY),'Overview','What needs doing today across leads, classes, certificates and payments.')+
  `<div class="stats">
    <div class="stat"><span class="l">Open leads</span><span class="v">${state.leads.filter(l=>l.status==='Open').length}</span><span class="mini">${due.length} follow-up${due.length===1?'':'s'} due</span></div>
    <div class="stat"><span class="l">Students enrolled</span><span class="v">${state.students.length}</span><span class="mini">${state.students.filter(s=>s.scheduleType==='Weekly Courses').length} on weekly courses</span></div>
    <div class="stat"><span class="l">Attendance not marked</span><span class="v">${um.length}</span><span class="mini">${um.length?`across ${new Set(um.map(x=>x.date)).size} day${new Set(um.map(x=>x.date)).size>1?'s':''} up to today · <a href="#attendance" style="color:inherit">mark now</a>`:'All caught up'}</span></div>
    <div class="stat"><span class="l">Classes in the next 7 days</span><span class="v">${upcoming.length}</span><span class="mini">${upcoming.reduce((a,s)=>a+s.students.length,0)} student seats</span></div>
    <div class="stat"><span class="l">Owed to trainers</span><span class="v">${money(owed)}</span><span class="mini">at each trainer's hourly rate, no GST</span></div>

/* Leads */
const B2C_FIELDS=[['parentName','Parent name','text',100,1],['phone','Phone number','text',100],['email','Email','text',100],['childName',"Child's name",'text',100,1],['age','Age','text',100],['school','School','text',100],['interestedIn','Interested in','select',['Weekly courses','Camps & workshops']],['location','Location preference','text',100],['heardFrom','How did you hear about us?','textarea',1000],['specificInterest','Specific interest','textarea',1000],['followUpDate','Follow-up date','date'],['trialDate','Trial class date','date'],['comments','Comments','textarea',1000]];
const B2B_FIELDS=[['partnershipName','Partnership name','text',500,1],['phone','Phone number','text',100],['email','Email','text',100],['interestedIn','Interested in','select',['Weekly courses','Camps & workshops']],['location','Location preference','text',100],['heardFrom','How did you hear about us?','textarea',1000],['specificInterest','Specific interest','textarea',1000],['followUpDate','Follow-up date','date'],['comments','Comments','textarea',1000]];
function fieldHtml([k,label,type,lim,req],val){
  const id='lf-'+k;const full=type==='textarea'?' full':'';
  let input;
  if(type==='select')input=`<select id="${id}" name="${k}">${lim.map(o=>opt(o,val)).join('')}</select>`;
  else if(type==='textarea')input=`<textarea id="${id}" name="${k}" maxlength="${lim}" data-count>${esc(val)}</textarea><span class="counter">${(val||'').length} / ${lim}</span>`;
  else if(type==='date')input=`<input type="date" id="${id}" name="${k}" value="${esc(val)}">`;
  else input=`<input type="text" id="${id}" name="${k}" maxlength="${lim}" value="${esc(val)}"${req?' required':''}>`;
  const hint=k==='trialDate'?'<span class="hint">Books a trial class in the Schedule Generator.</span>':k==='followUpDate'?'<span class="hint">You also get a reminder every 5 days.</span>':'';
  return `<div class="field${full}"><label for="${id}">${esc(label)}${req?' *':''}</label>${input}${hint}</div>`;
}
function openLeadForm(id,type){
  const l=id?leadById(id):{type:type||ui.leadTab,status:'Open',interestedIn:'Weekly courses'};
  const fields=l.type==='B2C'?B2C_FIELDS:B2B_FIELDS;
  openModal(`<h2>${id?'Edit':'New'} ${l.type} lead</h2><form data-form="lead" data-id="${id||''}" data-type="${l.type}"><div class="form">${fields.map(f=>fieldHtml(f,l[f[0]]??'')).join('')}
  <div class="field"><label for="lf-status">Status</label><select id="lf-status" name="status">${['Open','Converted','Closed'].map(o=>opt(o,l.status)).join('')}</select></div></div>
  <div class="foot" style="margin-top:16px"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary">${id?'Save changes':'Add lead'}</button></div></form>`);
}

    <td>${l.status!=='Open'?'<span class="muted">—</span>':d?chip('Due '+fmtD(nx),'warn'):fmtD(nx)}</td>
    ${t==='B2C'?`<td>${l.trialDate?fmtD(l.trialDate)+(trial?`<span class="small">${slotStr(trial.start,trial.end)}</span>`:''):'<span class="muted">—</span>'}</td>`:''}
    <td>${st}</td>

  const head=['Lead','Contact','Interested in','Registered','Next reminder',...(t==='B2C'?['Trial class']:[]),'Status',''];
  return header('Module 1','Leads Tracker','Sales leads and prospects. Each open lead gets a reminder 5 days after it was registered or last followed up, or on its follow-up date if sooner.',
    `<button class="btn" data-act="export-leads">Export to Excel</button><button class="btn primary" data-act="lead-new">New ${t} lead</button>`)+
  (due?`<div class="notice"><b>${due} follow-up${due>1?'s':''} due.</b><span>Mark a lead as followed up to restart its 5-day reminder.</span></div>`:'')+
  `<div class="tabs" role="tablist">${['B2C','B2B'].map(x=>`<button role="tab" class="${x===t?'on':''}" aria-selected="${x===t}" data-act="lead-tab" data-tab="${x}">${x==='B2C'?'B2C · Parents':'B2B · Partnerships'} <span class="muted">${state.leads.filter(l=>l.type===x).length}</span></button>`).join('')}</div>`+
  table(head,rows,`No ${t} leads yet.`);

/* Trainers */
function vTrainers(){
  const slots=trainerSlots();
  const months=[...new Set(slots.map(s=>monthKey(s.date)))].sort();
  const stats=state.trainers.map(t=>{const mine=slots.filter(s=>s.trainerId===t.id&&s.status==='Present');return {t,hours:mine.reduce((a,s)=>a+s.hours,0),owed:mine.filter(s=>!s.paid).reduce((a,s)=>a+s.due,0),paid:mine.filter(s=>s.paid).reduce((a,s)=>a+s.due,0)}});
  const maxH=Math.max(1,...stats.map(s=>s.hours));const top=stats.reduce((a,s)=>s.hours>(a?.hours||0)?s:a,null);
  const tot=stats.reduce((a,s)=>({h:a.h+s.hours,o:a.o+s.owed,p:a.p+s.paid}),{h:0,o:0,p:0});
  const f=ui.trainerFilter,m=ui.trainerMonth;
  const shown=slots.filter(s=>(f==='all'||s.trainerId===f)&&(m==='all'||monthKey(s.date)===m));
  const rows=shown.map(s=>`<tr class="${s.status==='Upcoming'?'':'past'}"><td><b>${esc(trainerName(s.trainerId))}</b></td><td>${fmtDw(s.date)}</td><td>${esc(s.location)}</td><td>${esc(s.room)}</td><td>${esc(s.students.join(', '))}</td><td>${slotStr(s.start,s.end)}</td><td class="num">${s.hours}</td><td class="num">${money(s.rate)}</td>
    <td>${s.status==='Upcoming'?chip('Upcoming'):`<select data-chg="slot-status" data-key="${esc(s.key)}" aria-label="Attendance">${['Present','Absent'].map(o=>opt(o,s.status)).join('')}</select>`}</td>
    <td class="num">${s.status==='Upcoming'?'—':money(s.due)}</td>
    <td>${s.status==='Present'?`<select data-chg="slot-pay" data-key="${esc(s.key)}" aria-label="Payment status">${opt('due',s.paid?'paid':'due','Payment Due')}${opt('paid',s.paid?'paid':'due','Paid')}</select>`:'<span class="muted">—</span>'}</td></tr>`);
  return header('Module 2','Trainer Hours',`Each trainer is paid their own hourly rate, set in the Trainers list (no GST). Hours count once per class taught, however many students attend.`,`<button class="btn" data-act="export-trainers">Export report to Excel</button>`)+
  `<div class="stats"><div class="stat"><span class="l">Hours clocked</span><span class="v">${tot.h}</span></div><div class="stat"><span class="l">Payment due</span><span class="v">${money(tot.o)}</span></div><div class="stat"><span class="l">Paid to date</span><span class="v">${money(tot.p)}</span></div><div class="stat"><span class="l">Most hours</span><span class="v" style="font-size:20px">${top?esc(top.t.name):'—'}</span><span class="mini">${top?top.hours+' hours':''}</span></div></div>
  <div class="grid2">
    <div class="card"><h2>Hours by trainer</h2><div class="bars">${stats.map(s=>`<div class="barrow"><span>${esc(s.t.name)}${s.t.active?'':' <span class="mini">(removed)</span>'}</span><div class="track" role="img" aria-label="${s.hours} hours"><div class="fill${s===top?' top':''}" style="width:${s.hours/maxH*100}%"></div></div><span class="amt">${s.hours} h · ${money(s.owed)} due</span></div>`).join('')}</div></div>
    <div class="card"><h2>Trainers</h2><div class="list">${state.trainers.map(t=>`<div class="it"><div><b>${esc(t.name)}</b> ${t.active?'':chip('Removed')}<span class="small mini">${[t.phone,t.email].filter(Boolean).map(esc).join(' · ')}</span></div><div class="row right" style="flex-wrap:nowrap"><span class="chip info">${money(rateOf(t.id))}/hr</span><button class="btn sm ghost" data-act="trainer-edit" data-id="${t.id}">Edit</button>${t.active?`<button class="btn sm ghost danger" data-act="trainer-remove" data-id="${t.id}">Remove</button>`:`<button class="btn sm ghost" data-act="trainer-restore" data-id="${t.id}">Restore</button>`}</div></div>`).join('')}</div>
      <form data-form="trainer" class="form"><div class="field"><label for="tr-name">Name *</label><input type="text" id="tr-name" name="name" maxlength="100" required></div><div class="field"><label for="tr-phone">Phone</label><input type="text" id="tr-phone" name="phone" maxlength="100"></div><div class="field"><label for="tr-email">Email</label><input type="text" id="tr-email" name="email" maxlength="100"></div><div class="field"><label for="tr-rate">Pay per hour (S$) *</label><input type="number" id="tr-rate" name="rate" min="0" max="1000" step="0.5" value="${esc(state.rate)}" required><span class="hint">No GST. Change it later with Edit.</span></div><div class="full"><button class="btn primary">Add trainer</button></div></form></div>
  </div>
  <div class="card"><div class="row"><h2>Hours & payment report</h2><div class="row right"><label class="lbl" for="tf">Trainer</label><select id="tf" data-chg="trainer-filter" style="width:auto">${opt('all',f,'All trainers')}${state.trainers.map(t=>opt(t.id,f,t.name)).join('')}</select><label class="lbl" for="tm">Month</label><select id="tm" data-chg="trainer-month" style="width:auto">${opt('all',m,'All months')}${months.map(k=>opt(k,m,monthLabel(k))).join('')}</select></div></div>
  ${table(['Trainer','Date','Location','Classroom','Students','Time slot',['Hours','num'],['Rate / hr','num'],'Status',['Payment due','num'],'Payment status'],rows,'No classes for this selection.')}</div>`;

/* Certificates */
function vCerts(){
  const all=certRows();const due=all.filter(c=>c.status==='Due');
  const years=[...new Set(all.map(c=>c.end.slice(0,4)))].sort();if(!years.includes(ui.certYear))years.push(ui.certYear);
  const shown=all.filter(c=>(ui.certYear==='all'||c.end.slice(0,4)===ui.certYear)&&(ui.certMonth==='all'||+c.end.slice(5,7)===+ui.certMonth)).sort((a,b)=>a.end<b.end?-1:1);
  const rows=shown.map(c=>`<tr><td><b>${esc(stName(c.st))}</b></td><td><input type="text" maxlength="100" value="${esc(c.printName)}" data-chg="cert-name" data-id="${c.st.id}" aria-label="Name printed on certificate"></td><td>${esc(c.st.course)}</td><td>${esc(trainerName(c.trainer))}</td><td>${fmtD(c.start)}</td><td>${fmtD(c.end)}</td>
    <td><input type="date" value="${esc(c.issueDate)}" data-chg="cert-date" data-id="${c.st.id}" aria-label="Certificate issue date"></td>
    <td>${c.status==='Printed'?chip('Printed','good'):c.status==='Due'?chip('Print now','warn'):chip('Upcoming')}</td>
    <td>${c.status!=='Printed'?`<button class="btn sm" data-act="cert-print" data-id="${c.st.id}">Mark printed</button>`:''}</td></tr>`);
  return header('Module 3','Certificates Tracker','One certificate per student at the end of their course. You are reminded 10 days before the course end date to start printing.',`<button class="btn" data-act="export-certs">Export to Excel</button>`)+
  (due.length?`<div class="notice"><b>${due.length} certificate${due.length>1?'s':''} due for printing.</b><span>${due.map(c=>`${esc(c.printName)} (ends ${fmtD(c.end)})`).join(' · ')}</span></div>`:'')+
  `<div class="row"><label class="lbl" for="cm">Course end month</label><select id="cm" data-chg="cert-month" style="width:auto">${opt('all',ui.certMonth,'All months')}${MONTHS.map((n,i)=>opt(i+1,ui.certMonth,n)).join('')}</select><label class="lbl" for="cy">Year</label><select id="cy" data-chg="cert-year" style="width:auto">${opt('all',ui.certYear,'All years')}${years.map(y=>opt(y,ui.certYear)).join('')}</select></div>`+
  table(['Student name','Name to print','Course','Trainer','Start date','End date','Certificate issue date','Status',''],rows,'No courses end in this period.');
}

const fmtSize=b=>b>=1e6?(b/1e6).toFixed(1)+' MB':Math.max(1,Math.round(b/1e3))+' KB';

function richText(t){

    if(lines.length&&lines.every(l=>/^\s*[-•*]\s+/.test(l)))return `<ul>${lines.map(l=>`<li>${inlineText(l.replace(/^\s*[-•*]\s+/,''))}</li>`).join('')}</ul>`;

const DEFAULT_CATS={course:['Resolute Novice','Resolute Apprentice','Resolute Advanced'],camp:['Roblox','Minecraft','Robotics','Designing Camp','Coding Camp'],workshop:['Workshops']};
function restructureCats(o){
  const cats=[];const add=(type,name)=>{const c={id:uid(),type,name};cats.push(c);return c};
  Object.entries(DEFAULT_CATS).forEach(([t,ns])=>ns.forEach(n=>add(t,n)));
  (o.curriculum||[]).forEach(p=>{
    const pool=cats.filter(c=>c.type===p.type);
    let c=pool.filter(c=>norm(p.title).includes(norm(c.name).replace(/ camp$/,''))).sort((a,b)=>b.name.length-a.name.length)[0];
    if(!c&&p.sample)c=pool.find(x=>x.name==='Roblox');
    if(!c&&p.series&&!['resolute programme','holiday camps','workshops','example'].includes(norm(p.series)))c=pool.find(x=>norm(x.name)===norm(p.series))||add(p.type,p.series);
    if(!c&&p.type==='workshop')c=pool.find(x=>x.name==='Workshops');
    p.catId=c?c.id:'';
  });
  o.curCats=cats;
}

function curList(){

  const out=[];
  PTYPES.filter(t=>u.tab==='all'||t[0]===u.tab).forEach(([t,plural,single])=>{
    const cats=state.curCats.filter(c=>c.type===t);
    const groups=cats.map(c=>({c,ps:state.curriculum.filter(p=>p.type===t&&p.catId===c.id)}));
    const orphans=state.curriculum.filter(p=>p.type===t&&!cats.some(c=>c.id===p.catId));
    if(orphans.length)groups.push({c:null,ps:orphans});

      if(q&&!ps.length&&!(g.c&&norm(g.c.name).includes(q)))return;
      out.push(`<div class="cathead"><h2 class="series">${esc(g.c?g.c.name:'Uncategorised')}</h2><span class="mini">${single} category · ${g.ps.length} ${g.ps.length===1?single.toLowerCase():plural.toLowerCase()}</span>${isAdmin()&&g.c?`<div class="row right"><button class="btn sm ghost" data-act="cur-prog-new" data-cat="${g.c.id}">Add ${single.toLowerCase()}</button><button class="btn sm ghost" data-act="cur-cat-edit" data-cat="${g.c.id}">Edit</button><button class="btn sm ghost danger" data-act="cur-cat-del" data-cat="${g.c.id}">Delete</button></div>`:''}</div>`+
        (ps.length?`<div class="plist">${ps.map(progRow).join('')}</div>`:`<p class="muted" style="margin:0">No ${plural.toLowerCase()} in this category yet.</p>`));

/* Franchise royalty (Resolute Robotics) */
function defaultRoyalty(courses){const c=courses&&courses.weekly?courses:copyCourses();return {royaltyPct:9,marketingPct:2,courses:c.weekly.filter(x=>/^resolute/i.test(x)),paid:{}}}
const roy=()=>state.royalty||(state.royalty=defaultRoyalty(state.courses));
const isFranchise=course=>roy().courses.some(c=>norm(c)===norm(course));
// Revenue = invoices issued (weekly courses) + camp/workshop fees in their start month, for franchise courses only.
function royaltyLines(){
  const out=[];
  allInvoices().filter(i=>i.status!=='Scheduled'&&isFranchise(i.st.course)).forEach(i=>out.push({month:monthKey(i.issue),date:i.issue,st:i.st,course:i.st.course,type:'Weekly course',ref:i.no,amount:i.amount,paid:i.status==='Paid'}));
  state.students.filter(st=>st.scheduleType!=='Weekly Courses'&&st.fee>0&&st.startDate&&isFranchise(st.course)).forEach(st=>out.push({month:monthKey(st.startDate),date:st.startDate,st,course:st.course,type:st.scheduleType==='Holiday Camp'?'Camp':'Workshop',ref:'Enrollment fee',amount:+st.fee,paid:null}));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function royaltyMonths(){
  const r=roy(),pct=(+r.royaltyPct||0)+(+r.marketingPct||0);const by={};
  royaltyLines().forEach(l=>{const m=(by[l.month]??={month:l.month,revenue:0,lines:0});m.revenue=round2(m.revenue+l.amount);m.lines++});
  Object.keys(r.paid||{}).forEach(m=>{by[m]??={month:m,revenue:0,lines:0}});
  return Object.values(by).sort((a,b)=>a.month<b.month?1:-1).map(m=>({...m,royalty:round2(m.revenue*(+r.royaltyPct||0)/100),marketing:round2(m.revenue*(+r.marketingPct||0)/100),total:round2(m.revenue*pct/100),paid:(r.paid||{})[m.month]||''}));
}
function royaltyCard(){
  const r=roy();const used=t=>state.students.filter(s=>catKey(s.scheduleType)===t).map(s=>s.course);
  const group=(k,title)=>{const names=[...new Set([...state.courses[k],...used(k)])];return `<div style="display:flex;flex-direction:column;gap:4px"><h3>${title}</h3>${names.length?`<div class="checks" style="max-height:none">${names.map(n=>`<label><input type="checkbox" name="rc" value="${esc(n)}"${isFranchise(n)?' checked':''}> ${esc(n)}</label>`).join('')}</div>`:'<span class="mini">None yet.</span>'}</div>`};
  return `<div class="card"><h2>Resolute franchise royalty</h2><p class="sub">Royalty and marketing fees payable to Resolute Robotics, worked out on the revenue of the programmes ticked below. See the Royalties page for the monthly amounts.</p>
  <form data-form="royalty" style="display:flex;flex-direction:column;gap:14px"><div class="form"><div class="field"><label for="ry-r">Royalty (%)</label><input type="number" id="ry-r" name="royaltyPct" min="0" max="100" step="0.1" value="${esc(r.royaltyPct)}" required></div><div class="field"><label for="ry-m">Marketing (%)</label><input type="number" id="ry-m" name="marketingPct" min="0" max="100" step="0.1" value="${esc(r.marketingPct)}" required></div>
  <div class="full mini">Total payable: <b>${round2((+r.royaltyPct||0)+(+r.marketingPct||0))}%</b> of franchise revenue.</div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px">${group('weekly','Courses')}${group('camp','Camps')}${group('workshop','Workshops')}</div>
  <div><button class="btn primary">Save royalty settings</button></div></form></div>`;
}
function vRoyalty(){
  const r=roy(),months=royaltyMonths(),pct=round2((+r.royaltyPct||0)+(+r.marketingPct||0));
  const nowM=monthKey(TODAY);if(!ui.royMonth)ui.royMonth=(months.find(m=>m.month<=nowM)||months[0]||{month:nowM}).month;
  const ytd=months.filter(m=>m.month.slice(0,4)===nowM.slice(0,4));const sum=k=>round2(ytd.reduce((a,m)=>a+m[k],0));
  const owed=round2(months.filter(m=>!m.paid&&m.month<=nowM).reduce((a,m)=>a+m.total,0));

    <td>${m.paid?chip('Paid '+fmtD(m.paid),'good'):m.month>nowM?chip('Not due'):`<button class="btn sm" data-act="roy-paid" data-m="${m.month}">Mark paid</button>`}${m.paid?` <button class="btn sm ghost" data-act="roy-unpaid" data-m="${m.month}">Undo</button>`:''}</td></tr>`);
  return header('Module 1','Royalties',`Royalty payable to Resolute Robotics: ${esc(r.royaltyPct)}% royalty + ${esc(r.marketingPct)}% marketing = ${pct}% of franchise revenue. Revenue counts weekly-course invoices once issued, and camp and workshop fees in their start month. Change the rates and programmes in Settings.`,`<button class="btn" data-act="export-royalty">Export to Excel</button><a class="btn" href="#setup">Royalty settings</a>`)+
  `<div class="stats"><div class="stat"><span class="l">Franchise revenue ${nowM.slice(0,4)}</span><span class="v">${money(sum('revenue'))}</span></div><div class="stat"><span class="l">Royalty (${esc(r.royaltyPct)}%) ${nowM.slice(0,4)}</span><span class="v">${money(sum('royalty'))}</span></div><div class="stat"><span class="l">Marketing (${esc(r.marketingPct)}%) ${nowM.slice(0,4)}</span><span class="v">${money(sum('marketing'))}</span></div><div class="stat"><span class="l">Payable, not yet paid</span><span class="v">${money(owed)}</span><span class="mini">up to ${monthLabel(nowM)}</span></div></div>
  ${r.courses.length?'':'<div class="notice"><b>No programmes selected.</b><span>Tick the Resolute franchise courses, camps and workshops in Settings.</span></div>'}
  <div class="card"><h2>By month</h2>${table(['Month',['Items','num'],['Revenue','num'],[`Royalty ${esc(r.royaltyPct)}%`,'num'],[`Marketing ${esc(r.marketingPct)}%`,'num'],[`Total ${pct}%`,'num'],'Paid to Resolute'],rows,'No franchise revenue yet.')}</div>
  <div class="card"><h2>${monthLabel(ui.royMonth)}: what's included</h2>${table(['Date','Student','Programme','Type','Reference',['Amount','num'],'Collected'],lines.map(l=>`<tr><td>${fmtD(l.date)}</td><td>${esc(stName(l.st))}</td><td>${esc(l.course)}</td><td>${l.type}</td><td class="mono">${esc(l.ref)}</td><td class="num">${money(l.amount)}</td><td>${l.paid===null?'<span class="muted">—</span>':l.paid?chip('Paid','good'):chip('Unpaid','warn')}</td></tr>`),'Nothing for this month.')}
  <p class="mini" style="margin:0">A camp or workshop only counts when a fee is entered on its enrollment.</p></div>`;
}

/* Schedule */
function vSchedule(){
  const tab=ui.schedTab;
  const tabs=`<div class="tabs" role="tablist">${[['course','Course schedules'],['trial','Trial classes']].map(([k,l])=>`<button role="tab" class="${tab===k?'on':''}" aria-selected="${tab===k}" data-act="sched-tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  const head=header('Module 8','Schedule Generator','Weekly classes run once a week for 90 minutes, or the student\'s own time slot. Slots start from 2 PM on weekdays and 9 AM on weekends, and public holidays are skipped. Edit anything below and the schedule rebuilds around it.',`<button class="btn" data-act="regen-all">Regenerate all</button>`);
  if(tab==='trial')return head+tabs+vTrials();
  if(!state.students.length)return head+tabs+'<div class="card empty">Enroll a student to generate a schedule.</div>';
  let st=studentById(ui.schedStudent);if(!st){st=state.students[0];ui.schedStudent=st.id}
  const list=state.sessions.filter(x=>x.studentId===st.id).sort((a,b)=>a.date===b.date?(a.start<b.start?-1:1):(a.date<b.date?-1:1));
  const mates=[...new Set(state.sessions.filter(x=>x.groupId===st.pattern?.groupId&&x.studentId&&x.studentId!==st.id).map(x=>x.studentId))].map(id=>stName(studentById(id)));
  const p=st.pattern;const regTrainer=list[0]?.trainerId;
  const rows=list.map(s=>{const past=s.date<TODAY;
    const flags=[s.kind==='makeup'?chip((s.mode==='join'?'Joined class':'Make-up session')+' · for '+(s.forLabel||''),'accent'):'',s.makeup&&s.makeupMode==='pending'?chip('Make-up to arrange','warn'):'',s.makeup&&['one','join'].includes(s.makeupMode)?chip('Make-up booked','warn'):'',s.key[0]==='M'?chip(s.makeupFor==='Extra class'?'Extra class':'Make-up for '+s.makeupFor,'accent'):'',s.manual?chip('Moved','info'):'',s.conflict?chip('Room clash','bad'):'',s.status==='Cancelled'?chip('Not held: '+(s.reason||'—'),'bad'):'',schoolHolOn(s.date)?chip('School holiday','good'):''].join(' ');
    return `<tr class="${past?'past':''} ${s.status==='Cancelled'?'cancel':''}"><td><b>${s.key[0]==='R'?'Session '+s.key.slice(1):'Make-up '+s.key.slice(1)}</b></td><td>${fmtDw(s.date)}</td><td>${slotStr(s.start,s.end)}</td><td>${esc(s.room)}</td><td>${esc(trainerName(s.trainerId))}</td>
    <td><select data-chg="sess-override" data-id="${s.id}" aria-label="Override trainer">${trainerOpts(s.override,'No override')}</select></td>
    <td><select data-chg="sess-status" data-id="${s.id}" aria-label="Student status">${['Scheduled','Present','Absent','Cancelled'].map(o=>opt(o,s.status,o==='Cancelled'?'Not held':o)).join('')}</select></td>
    <td style="text-align:center"><input type="checkbox" data-chg="sess-makeup" data-id="${s.id}" aria-label="Needs a make-up class"${s.makeup?' checked':''}></td>
    <td><div class="row" style="flex-wrap:nowrap">${flags}<button class="btn sm ghost" data-act="sess-resched" data-id="${s.id}">Reschedule</button></div></td></tr>`});
  const pdur=p?.dur||(st.scheduleType==='Weekly Courses'?90:180);
  const pattTxt=p&&p.start?(st.scheduleType==='Weekly Courses'?`Every ${DOWL[p.wd]} · ${slotStr(p.start,plus(p.start,pdur))}`:`Daily · ${slotStr(p.start,plus(p.start,pdur))}`)+` (${pdur} min)${hasCustomSlot(st)?' · custom':''}`:'—';
  return head+tabs+
  `<div class="row"><label class="lbl" for="ss">Student</label><select id="ss" data-chg="sched-student" style="width:auto;max-width:100%">${SCHED_TYPES.map(t=>{const g=state.students.filter(s=>s.scheduleType===t);return g.length?`<optgroup label="${t}">${g.map(s=>opt(s.id,st.id,`${stName(s)} — ${s.course}`)).join('')}</optgroup>`:''}).join('')}</select>

/* Attendance */
const pendingMakeups=()=>state.sessions.filter(x=>x.studentId&&x.status==='Absent'&&x.makeup&&x.makeupMode==='pending').sort((a,b)=>a.date<b.date?-1:1);
const attState=s=>s.status==='Present'?'Present':s.status==='Absent'?(s.makeup?'Makeup':'Absent'):'';
function classCards(date){
  const m=new Map();
  state.sessions.filter(x=>live(x)&&x.date===date).forEach(x=>{const k=slotKey(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
  return [...m.entries()].map(([k,list])=>({k,list:list.sort((a,b)=>sessName(a)<sessName(b)?-1:1),start:list[0].start,end:list.reduce((a,x)=>x.end>a?x.end:a,''),location:list[0].location,room:list[0].room})).sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:(a.room<b.room?-1:1));
}
function bookMakeup(src,mode,o){
  const st=studentById(src.studentId);
  const n=Math.max(0,...state.sessions.filter(x=>x.studentId===st.id&&x.kind==='makeup').map(x=>+x.key.slice(1)||0))+1;
  const s={id:uid(),studentId:st.id,leadId:null,kind:'makeup',key:'X'+n,course:st.course,status:'Scheduled',makeup:false,reason:'',override:'',manual:true,mode,forKey:src.key,forLabel:keyLabel(src.key),forDate:src.date,...o};
  state.sessions.push(s);src.makeupMode=mode;src.makeupRef=s.id;return s;
}
function cancelMakeup(mk){
  state.sessions=state.sessions.filter(x=>x.id!==mk.id);
  const src=state.sessions.find(x=>x.studentId===mk.studentId&&x.key===mk.forKey);
  if(src&&src.makeupRef===mk.id){src.makeupMode='pending';src.makeupRef=''}
}
function markAttendance(s,v){
  const st=s.studentId?studentById(s.studentId):null;
  const wasEnd=isEndMk(s), cur=attState(s);
  if(cur===v)v='';
  if(cur==='Makeup'&&v!=='Makeup'){if(s.makeupRef)state.sessions=state.sessions.filter(x=>x.id!==s.makeupRef);s.makeup=false;s.makeupMode='';s.makeupRef=''}
  if(v==='Present')s.status='Present';
  else if(v==='Absent')s.status='Absent';
  else if(v==='Makeup'){s.status='Absent';s.makeup=true;s.makeupMode='pending';s.makeupRef=''}
  else s.status='Scheduled';
  if(st&&s.kind==='weekly'&&wasEnd!==isEndMk(s))generateStudent(st);
}
function sessionTag(s){
  if(s.kind==='trial')return 'Trial class';
  if(s.kind==='makeup')return 'Make-up for '+(s.forLabel||'');
  const st=studentById(s.studentId);if(!st)return '';
  if(s.key[0]==='M')return 'Make-up '+s.key.slice(1);
  const n=+s.key.slice(1);return `Session ${pad(n)} of ${st.sessions}`;
}
function nextOf(s){
  if(!s.studentId)return null;
  return state.sessions.filter(x=>x.studentId===s.studentId&&live(x)&&(x.date>s.date||(x.date===s.date&&x.start>s.start))).sort((a,b)=>a.date===b.date?(a.start<b.start?-1:1):(a.date<b.date?-1:1))[0]||null;
}
function joinOptions(src){
  const st=studentById(src.studentId);const m=new Map();
  const lo=addDays(src.date<TODAY?src.date:TODAY,-28),hi=addDays(src.date>TODAY?src.date:TODAY,28);
  state.sessions.filter(x=>live(x)&&x.date>=lo&&x.date<=hi).forEach(x=>{const k=slotKey(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});
  return [...m.entries()].filter(([k,l])=>l.every(x=>['weekly','makeup','trial'].includes(x.kind))&&!l.some(x=>x.studentId===st.id)&&l.length<MAX_GROUP)
    .map(([k,l])=>{const h=l[0];const sameCourse=l.some(x=>norm(x.course)===norm(st.course)),sameLoc=h.location===locOf(st);
      return {k,h,l,sameCourse,sameLoc,score:(sameCourse?4:0)+(sameCourse&&l.some(x=>x.kind==='makeup')?2:0)+(sameLoc?1:0)}})
    .sort((a,b)=>b.score-a.score||Math.abs(diffDays(a.h.date,src.date))-Math.abs(diffDays(b.h.date,src.date))||(a.h.start<b.h.start?-1:1)).slice(0,12);
}
// After a make-up is booked: offer it to other students on the same course who are waiting for one.
function suggestOthers(mk){
  if(!mk)return;const st=studentById(mk.studentId);if(!st)return;
  const inSlot=state.sessions.filter(x=>live(x)&&slotKey(x)===slotKey(mk));const space=MAX_GROUP-inSlot.length;if(space<=0)return;
  const src=state.sessions.find(x=>x.studentId===mk.studentId&&x.key===mk.forKey);
  const c=pendingMakeups().filter(x=>x.studentId!==mk.studentId&&!inSlot.some(y=>y.studentId===x.studentId)&&norm(x.course)===norm(st.course))
    .map(x=>({x,sameClass:!!src&&x.groupId===src.groupId,sameDay:!!src&&x.date===src.date}))
    .sort((a,b)=>(b.sameClass+b.sameDay)-(a.sameClass+a.sameDay)||(a.x.date<b.x.date?-1:1))
    .filter((o,i,arr)=>arr.findIndex(y=>y.x.studentId===o.x.studentId)===i);
  if(!c.length)return;
  openModal(`<h2>Add others to this make-up?</h2><p class="muted" style="margin:0">${fmtDw(mk.date)} · ${slotStr(mk.start,mk.end)} · ${esc(mk.room)} · ${esc(trainerName(effTrainer(mk)))}. These students on ${esc(st.course)} are also waiting for a make-up. Room for ${space} more.</p>
  <form data-form="mkothers" data-id="${mk.id}" style="display:flex;flex-direction:column;gap:14px"><div class="checks">${c.map(o=>`<label><input type="checkbox" name="add" value="${o.x.id}"${o.sameClass&&o.sameDay?' checked':''}> ${esc(sessName(o.x))} <span class="mini">· missed ${esc(sessionTag(o.x))} on ${fmtD(o.x.date)}</span>${o.sameClass&&o.sameDay?' '+chip('Same class, same day','good'):o.sameClass?' '+chip('Same class','good'):''}</label>`).join('')}</div>
  <div class="foot"><button type="button" class="btn" data-act="modal-close">Not now</button><button class="btn primary">Add to this make-up</button></div></form>`);
}
function openArrange(id){
  const src=state.sessions.find(x=>x.id===id);const st=studentById(src.studentId);const weekly=src.kind==='weekly';
  const opts=joinOptions(src);const len=toMin(src.end)-toMin(src.start);
  let d1=addDays(TODAY,1),g=0;while(blockedOn(d1)&&g++<14)d1=addDays(d1,1);

  openModal(`<h2>Arrange a make-up for ${esc(stName(st))}</h2><p class="muted" style="margin:0">Missed ${esc(sessionTag(src))} on ${fmtDw(src.date)} · ${esc(st.course)} · ${esc(src.location)}</p>
  <form data-form="makeup" data-id="${src.id}" class="form">
    <div class="field full"><span class="lbl">How should the lesson be made up?</span><div class="pick" style="max-height:none">
      ${radio('join','Join another class','Recommended. The student sits in on a class that is already running, so no extra trainer hours.')}
      ${radio('one','Make-up session','A separate session at a time you choose. One-to-one, or add other students who need a make-up.')}
      ${weekly?radio('end','Add a class at the end of the course','One more class in the usual weekly slot, after the last session.'):''}
    </div></div>
    <div class="field full" data-mu="join"${first==='join'?'':' hidden'}><span class="lbl">Classes with space, from 4 weeks before to 4 weeks after (best match first)</span>
      ${opts.length?`<div class="pick">${opts.map((o,i)=>{const names=o.l.map(x=>sessName(x));const hl=toMin(o.h.end)-toMin(o.h.start);
        return `<label><input type="radio" name="host" value="${esc(o.k)}"${i===0?' checked':''}><span><b>${fmtDw(o.h.date)} · ${slotStr(o.h.start,o.h.end)}</b><span class="small mini">${esc(o.h.location)} · ${esc(o.h.room)} · ${esc(trainerName(effTrainer(o.h)))} · ${esc([...new Set(o.l.map(x=>x.course))].join(', '))}</span><span class="small mini">${o.l.length} student${o.l.length>1?'s':''}: ${esc(names.join(', '))}</span><span class="row" style="margin-top:4px;gap:4px">${o.l.some(x=>x.kind==='makeup')?chip('Make-up session','accent'):''}${o.sameCourse?chip('Same course','good'):chip('Different course')}${o.sameLoc?'':chip('Different location','warn')}${hl!==len?chip(hl+' min','info'):''}</span></span></label>`}).join('')}</div>`:'<p class="muted" style="margin:0">No class has space in that period. Book a make-up session instead.</p>'}
    </div>
    <div class="full form" data-mu="one"${first==='one'?'':' hidden'} style="padding:0">
      <div class="field"><label for="mu-date">Date</label><input type="date" id="mu-date" name="date" value="${d1}"></div>
      <div class="field"><label for="mu-time">Start time</label><input type="time" id="mu-time" name="time" step="900" value="${src.start}"></div>
      <div class="field"><label for="mu-dur">Duration in minutes</label><input type="number" id="mu-dur" name="duration" min="15" max="480" step="15" value="${len}"></div>
      <div class="field"><label for="mu-room">Classroom</label><select id="mu-room" name="room">${opt('auto','auto','First free room')}${state.classrooms.map(r=>opt(r,'',r)).join('')}</select></div>
      <div class="field full"><label for="mu-tr">Trainer</label><select id="mu-tr" name="trainer">${opt('auto','auto','First free trainer')}${trainerOpts('')}</select></div>
      <div class="field full"><span class="lbl">Also add students waiting for a make-up</span>${(()=>{const others=pendingMakeups().filter(x=>x.id!==src.id).sort((a,b)=>(norm(b.course)===norm(st.course))-(norm(a.course)===norm(st.course))||(a.date<b.date?-1:1));
        return others.length?`<div class="checks">${others.map(x=>`<label><input type="checkbox" name="also" value="${x.id}"> ${esc(sessName(x))} <span class="mini">· ${esc(x.course)} · missed ${esc(sessionTag(x))} on ${fmtD(x.date)}</span>${norm(x.course)===norm(st.course)?' '+chip('Same course','good'):''}</label>`).join('')}</div><span class="hint">Leave all unticked for a one-to-one session. Other students can also join it later from their own Arrange window.</span>`:'<span class="hint">No other students are waiting for a make-up. Others can join this session later from their own Arrange window.</span>'})()}</div>
    </div>
    <div class="full" data-mu="end" hidden><p class="mini" style="margin:0">The course stretches by one week. You can see the new class in the Schedule Generator.</p></div>
    <div class="full foot"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary">Book make-up</button></div>
  </form>`);
}
/* Class notes: what was covered, kept per class so the next trainer can pick up */
const planFind=v=>{if(!v)return null;const [a,b]=v.split('|');const p=(state.curriculum||[]).find(x=>x.id===a);if(!p)return null;const i=p.modules.findIndex(m=>m.id===b);return i<0?null:{p,m:p.modules[i],i}};
const planLabel=v=>{if(!v)return '';const f=planFind(v);if(f)return `${f.p.title} · ${f.i+1}) ${f.m.title}`;const [t,d]=v.split('|');return d?`${t} · Day ${d}`:t};
const planFiles=v=>planFind(v)?.m.files||[];
function prevNotes(list,date,start){
  const ids=new Set(list.map(x=>x.studentId||x.leadId));
  return Object.keys(state.classNotes).filter(k=>{const [d,s]=k.split('|');return (d<date||(d===date&&s<start))&&state.sessions.some(x=>slotKey(x)===k&&ids.has(x.studentId||x.leadId))}).sort().reverse().map(k=>({k,...state.classNotes[k]}));
}
function noteHtml(n,label,cls=''){
  const [d,st]=n.k.split('|');const files=planFiles(n.plan);
  return `<div class="note ${cls}"><div class="mini"><b>${label}</b> · ${fmtDw(d)}, ${fmtT(st)} · ${esc(trainerName(n.trainerId))}${n.plan?' · Lesson plan: '+(planFind(n.plan)?`<button class="linkbtn" data-act="cur-goto" data-plan="${esc(n.plan)}">${esc(planLabel(n.plan))}</button>`:esc(planLabel(n.plan))):''}</div><div class="clip">${esc(n.covered)}</div>${n.next?`<div class="mini clip"><b>For the next trainer:</b> ${esc(n.next)}</div>`:''}${files.length?`<div class="mini">Plan files: ${files.map(f=>esc(f.name)).join(', ')}</div>`:''}</div>`;
}
function notesRow(c,date){
  const n=state.classNotes[c.k];const prev=prevNotes(c.list,date,c.start)[0];const future=date>TODAY;
  return `<div style="align-items:flex-start"><div class="who" style="flex:1 1 320px"><span class="eyebrow">Class notes</span>
    ${n?noteHtml({k:c.k,...n},'This class','this'):''}
    ${prev?noteHtml(prev,'Last class'):(n?'':'<span class="mini">No notes yet from an earlier class with these students.</span>')}</div>
    ${future?'<span class="mini">Notes can be added on the day of the class.</span>':`<button class="btn sm${n?'':' primary'}" data-act="notes-open" data-k="${esc(c.k)}" data-d="${date}">${n?'Edit class notes':'Add class notes'}</button>`}</div>`;
}
function openNotes(k,date){
  const c=classCards(date).find(x=>x.k===k);if(!c)return;
  const n=state.classNotes[k]||{};const cur=effTrainer(c.list[0]);const earlier=prevNotes(c.list,date,c.start).slice(0,5);
  const planOpts=(n.plan&&!planFind(n.plan)?opt(n.plan,n.plan,planLabel(n.plan)):'')+state.curriculum.filter(p=>p.modules.length).map(p=>`<optgroup label="${esc(p.title)}">${p.modules.map((m,i)=>opt(`${p.id}|${m.id}`,n.plan||'',`${i+1}) ${m.title}`)).join('')}</optgroup>`).join('');
  const cnt=v=>`<span class="counter">${(v||'').length} / 1000</span>`;

function attResults(){
  const q=norm(ui.attQuery);if(!q)return '';const date=ui.attDate||TODAY;
  const people=[];
  state.students.forEach(st=>{if([stName(st),st.parentName,st.code,st.username].some(v=>norm(v).includes(q)))people.push({name:stName(st),sub:`${st.course} · ${locOf(st)} · Code ${st.code||'—'}`,parent:st.parentName,list:state.sessions.filter(x=>x.studentId===st.id&&live(x))})});
  state.leads.forEach(l=>{if(l.type==='B2C'&&state.sessions.some(x=>x.leadId===l.id)&&[l.childName,l.parentName].some(v=>norm(v).includes(q)))people.push({name:l.childName,sub:'Trial class · '+(l.specificInterest||l.interestedIn),parent:l.parentName,list:state.sessions.filter(x=>x.leadId===l.id&&live(x))})});

  return `<div class="list">${people.slice(0,20).map(p=>{const today=p.list.filter(x=>x.date===date).sort((a,b)=>a.start<b.start?-1:1);const nx=p.list.filter(x=>x.date>date).sort((a,b)=>a.date<b.date?-1:1)[0];
    return `<div class="it"><div class="who"><div><b>${esc(p.name)}</b> <span class="mini">${esc(p.sub)}</span></div><span class="mini">Parent: ${esc(p.parent)}${today.length?` · ${fmtD(date)}, ${today.map(x=>slotStr(x.start,x.end)+' in '+esc(x.room)).join(' and ')}`:` · No class on ${fmtD(date)}`}</span></div>
      ${today.length?today.map(segHtml).join(''):nx?`<button class="btn sm" data-act="att-goto" data-d="${nx.date}">Next class ${fmtD(nx.date)}</button>`:'<span class="mini">No upcoming classes</span>'}</div>`}).join('')}</div>${people.length>20?`<p class="mini" style="margin:0">Showing 20 of ${people.length}. Type more of the name to narrow it down.</p>`:''}`;
}
function vAttendance(){
  const date=ui.attDate||(ui.attDate=TODAY);
  const cards=classCards(date);const hol=blockedOn(date),sch=schoolHolOn(date);
  const pend=pendingMakeups();
  const upc=state.sessions.filter(x=>x.kind==='makeup'&&(x.date>=addDays(TODAY,-28)||(x.forDate||'')>=TODAY)).sort((a,b)=>a.date===b.date?(a.start<b.start?-1:1):(a.date<b.date?-1:1));
  const future=date>TODAY;
  const controls=`<div class="datebar"><button class="btn" data-act="att-day" data-n="-1" aria-label="Previous day">‹</button><input type="date" id="att-date" value="${date}" data-chg="att-date" aria-label="Date"><button class="btn" data-act="att-day" data-n="1" aria-label="Next day">›</button><button class="btn ghost" data-act="att-today">Today</button></div>`;
  const nextDay=cards.length?null:state.sessions.filter(x=>live(x)&&x.date>date).map(x=>x.date).sort()[0];
  const card=c=>{
    const counts={};c.list.forEach(x=>counts[x.trainerId]=(counts[x.trainerId]||0)+1);
    const regular=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];const cur=effTrainer(c.list[0]);
    const tkey=[date,c.start,c.location,c.room,cur].join('|');const tmeta=state.slotMeta[tkey]||{};const tstat=tmeta.status||'';
    const courses=[...new Set(c.list.map(x=>x.course))];
    const firstSt=c.list.find(x=>x.studentId)?.studentId;
    const rows=c.list.map(s=>{const st=s.studentId?studentById(s.studentId):null;const a=attState(s);const nx=nextOf(s);const trial=s.kind==='trial';
      const extra=s.kind==='makeup'?chip(s.mode==='join'?'Joined from another class':'Make-up session','accent'):
        a==='Makeup'?(s.makeupMode==='pending'?`${chip('Make-up to arrange','warn')}<button class="btn sm" data-act="mu-arrange" data-id="${s.id}">Arrange</button>`:s.makeupMode==='end'?chip('Make-up added at end of course','warn'):(()=>{const mk=state.sessions.find(x=>x.id===s.makeupRef);return mk?chip(`Make-up ${mk.mode==='join'?'(joined class)':'session'} ${fmtD(mk.date)}, ${fmtT(mk.start)}`,'warn'):''})()):'';
      return `<div><div class="who"><div><b>${esc(sessName(s))}</b> <span class="mini">${trial?'Trial · '+esc(s.course):esc(s.course)+(st?.code?' · '+esc(st.code):'')}</span></div>
        <div class="row" style="gap:6px"><span class="tag">${esc(sessionTag(s))}</span>${nx?chip(`Next: ${nx.kind==='makeup'?'Make-up':nx.key[0]==='R'?'Session '+nx.key.slice(1):'Make-up'} · ${fmtD(nx.date)}`,'info'):''}${extra}</div></div>
        <div class="seg" role="group" aria-label="Attendance for ${esc(sessName(s))}">
          <button type="button" class="${a==='Present'?'on g':''}" aria-pressed="${a==='Present'}" data-act="att-mark" data-id="${s.id}" data-v="Present">Present</button>
          <button type="button" class="${a==='Absent'?'on b':''}" aria-pressed="${a==='Absent'}" data-act="att-mark" data-id="${s.id}" data-v="Absent">Absent</button>
          ${trial?'':`<button type="button" class="${a==='Makeup'?'on w':''}" aria-pressed="${a==='Makeup'}" data-act="att-mark" data-id="${s.id}" data-v="Makeup">Make-up</button>`}
        </div></div>`}).join('');
    return `<div class="acard">
      <div><span class="time">${fmtT(c.start)}</span>${courses.map(x=>chip(x,'good')).join('')}<span class="where">${esc(c.location)} · ${esc(c.room)}</span><span class="mini">${slotStr(c.start,c.end)}</span>
        <div class="row right"><a class="btn sm" href="#portal">Lesson plans</a>${firstSt&&isAdmin()?`<button class="btn sm" data-act="st-schedule" data-id="${firstSt}">Open class</button>`:''}</div></div>
      <div><span class="eyebrow">Trainer</span><select data-chg="att-trainer" data-k="${esc(c.k)}" data-date="${date}" aria-label="Trainer for this class">${state.trainers.filter(t=>t.active||t.id===cur).map(t=>opt(t.id,cur,t.name+(t.id===regular?' (regular)':''))).join('')}</select>
        <div class="seg" role="group" aria-label="Trainer attendance"><button type="button" class="${tstat==='Present'?'on g':''}" data-act="att-trainer" data-key="${esc(tkey)}" data-v="Present"${future?' disabled':''}>Present</button><button type="button" class="${tstat==='Absent'?'on b':''}" data-act="att-trainer" data-key="${esc(tkey)}" data-v="Absent"${future?' disabled':''}>Absent</button></div></div>
      ${notesRow(c,date)}
      ${rows}</div>`};
  return `<div class="ph"><div><div class="eyebrow">${modLabel()}</div><h1>Attendance</h1></div>${controls}</div>
  <div class="card" style="gap:8px"><label class="lbl" for="att-search">Find a student</label><input type="search" id="att-search" value="${esc(ui.attQuery||'')}" placeholder="Type a student's or parent's name, or an attendance code" autocomplete="off"><div id="att-results">${attResults()}</div></div>
  ${(()=>{const um=unmarked().filter(x=>x.date!==date);if(!um.length)return '';const days={};um.forEach(x=>days[x.date]=(days[x.date]||0)+1);
    return `<div class="notice"><b>Not marked yet.</b><span class="row" style="gap:6px">${Object.keys(days).sort().map(d=>`<button class="btn sm" data-act="att-goto" data-d="${d}">${fmtD(d)} · ${days[d]}</button>`).join('')}</span></div>`})()}
  <div class="dayhead"><h2>${DOWL[dow(date)]}, ${pd(date).getDate()} ${MONTHS[pd(date).getMonth()]}${date===TODAY?' <span class="chip info" style="vertical-align:middle">Today</span>':''}</h2><span class="legend"><b class="t-good">Present</b> attended · <b class="t-bad">Absent</b> no make-up given · <b class="t-warn">Make-up</b> absent, lesson to be made up</span></div>
  ${hol?`<div class="notice"><b>${esc(hol.name)}.</b><span>No classes are scheduled on holidays.</span></div>`:''}${sch?`<div class="notice info"><b>${esc(sch.name)}.</b><span>Classes run as usual during school holidays.</span></div>`:''}
  ${cards.length?cards.map(card).join(''):`<div class="card empty">No classes on this day.${nextDay?` <button class="btn sm" data-act="att-goto" data-d="${nextDay}">Go to ${fmtDw(nextDay)}</button>`:''}</div>`}
  ${future?'<p class="mini" style="margin:0">Trainer attendance can be marked on the day or afterwards. You can mark a student absent in advance.</p>':''}
  <div class="grid2">
    <div class="card"><h2>Make-ups to arrange ${chip(pend.length,pend.length?'warn':'good')}</h2>${pend.length?`<div class="list">${pend.map(x=>`<div class="it"><div><b>${esc(sessName(x))}</b><span class="small mini">Missed ${esc(sessionTag(x))} · ${fmtDw(x.date)} · ${esc(x.course)}</span></div><button class="btn sm primary" data-act="mu-arrange" data-id="${x.id}">Arrange</button></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Nothing waiting.</p>'}</div>
    <div class="card"><h2>Booked make-ups ${chip(upc.length)}</h2>${upc.length?`<div class="list">${upc.map(x=>`<div class="it"><div><b>${esc(sessName(x))}</b> ${chip(x.mode==='join'?'Joined class':'Make-up session',x.mode==='join'?'good':'accent')}<span class="small mini">${fmtDw(x.date)} · ${slotStr(x.start,x.end)} · ${esc(x.location)} · ${esc(x.room)} · ${esc(trainerName(effTrainer(x)))}</span><span class="small mini">For ${esc(x.forLabel)} missed on ${fmtD(x.forDate)}</span></div><div class="row"><button class="btn sm" data-act="att-goto" data-d="${x.date}">View day</button><button class="btn sm ghost danger" data-act="mu-cancel" data-id="${x.id}">Cancel</button></div></div>`).join('')}</div>`:'<p class="muted" style="margin:0">None booked.</p>'}</div>
  </div>`;
}
